[project]
name = "snake-new"
version = "1.0.0"
description = "A classic grid snake built with pygame-ce."
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP", "B", "SIM"]
ignore = ["S311"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
